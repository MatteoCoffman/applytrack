AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: ApplyTrack serverless API — Cognito, Lambda, DynamoDB

Globals:
  Function:
    Timeout: 10
    Runtime: nodejs20.x
    Architectures:
      - arm64
    MemorySize: 256

Parameters:
  FrontendOrigin:
    Type: String
    Default: http://localhost:3000
    Description: Allowed CORS origin for the frontend (update after Vercel deploy)
  ProductionFrontendOrigin:
    Type: String
    Default: ""
    Description: Optional second CORS origin (e.g. Vercel URL)

Conditions:
  HasProductionFrontendOrigin:
    !Not [!Equals [!Ref ProductionFrontendOrigin, ""]]

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: applytrack-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          Required: true
          Mutable: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: applytrack-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders:
        - COGNITO

  ApplicationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: applytrack-applications
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handler.handler
      Description: ApplyTrack applications CRUD API
      Environment:
        Variables:
          TABLE_NAME: !Ref ApplicationsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ApplicationsTable
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /applications
            Method: GET
            Auth:
              Authorizer: JwtAuthorizer
        ApiCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /applications
            Method: POST
            Auth:
              Authorizer: JwtAuthorizer
        ApiUpdate:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /applications/{id}
            Method: PUT
            Auth:
              Authorizer: JwtAuthorizer
        ApiDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /applications/{id}
            Method: DELETE
            Auth:
              Authorizer: JwtAuthorizer
        ApiOptionsRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /applications
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        ApiOptionsId:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /applications/{id}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: makefile

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
          - !If
            - HasProductionFrontendOrigin
            - !Ref ProductionFrontendOrigin
            - !Ref AWS::NoValue
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        MaxAge: 600
      Auth:
        DefaultAuthorizer: JwtAuthorizer
        Authorizers:
          JwtAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient

Outputs:
  ApiUrl:
    Description: HTTP API base URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito App Client ID
    Value: !Ref UserPoolClient
  AwsRegion:
    Description: AWS Region
    Value: !Ref AWS::Region
  ApplicationsTableName:
    Description: DynamoDB table name
    Value: !Ref ApplicationsTable
